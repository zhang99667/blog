name: MarkZ Evolution

on:
  push:
    branches:
      - main
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: markz-evolution
  cancel-in-progress: true

jobs:
  report:
    name: Refresh maturity backlog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run evolve:check
      - run: npm run evals:check

      - name: Build current evolution reports
        run: |
          mkdir -p .cache
          npm run evolve:report -- --output .cache/evolution-report.md
          npm run evolve:report -- --format json --output .cache/evolution-report.json
          cat .cache/evolution-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the single evolution issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: "[AI Evolution] MarkZ maturity backlog"
        run: |
          set -euo pipefail
          retry_gh() {
            local attempt=1
            local max_attempts=4
            local delay_seconds=5

            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::GitHub API command failed after ${max_attempts} attempts: $*" >&2
                return 1
              fi
              echo "::warning::GitHub API command failed (attempt ${attempt}/${max_attempts}); retrying in ${delay_seconds}s: $*" >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }

          issue_number="$(retry_gh gh issue list --state open --limit 100 --json number,title --jq '.[] | select(.title == "[AI Evolution] MarkZ maturity backlog") | .number')"
          if [[ -n "$issue_number" ]]; then
            retry_gh gh issue edit "$issue_number" --body-file .cache/evolution-report.md
          else
            retry_gh gh issue create --title "$ISSUE_TITLE" --body-file .cache/evolution-report.md
          fi

      - name: Upload machine-readable evolution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markz-evolution-${{ github.run_id }}
          path: .cache/evolution-report.*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
